<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนผังอาคาร</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/map.css?v=4">
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><img class="logo" src="assets/logo.png" alt="ตราสำนักงานที่ดิน" width="64" height="63">
    <div><h1 id="title">แผนผังอาคาร</h1><p id="subtitle"></p></div></div>
  <nav class="topnav">
    <button class="travel-btn" id="travelOpen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>แผนที่การเดินทาง</button>
    <a href="admin.html">สำหรับเจ้าหน้าที่</a>
  </nav>
</div></header>
<div class="demo" id="demo" hidden>โหมดตัวอย่าง — ผังและจุดบริการยังเป็นข้อมูลสาธิต</div>

<main class="layout">
  <aside class="panel">
    <section class="steps" id="stepBox" hidden>
      <h2>ขั้นตอนการเข้ารับบริการ <small id="stepFloor"></small></h2>
      <ol id="steps"></ol>
      <div class="qr" id="qr"></div>
    </section>
    <div class="hd">
      <h2>ค้นหาจุดบริการ</h2>
      <p class="hint">เลือกจุดบริการเพื่อปักหมุดบนแผนผัง</p>
      <input class="search" id="q" type="search" placeholder="พิมพ์ชื่อห้องหรือบริการ" aria-label="ค้นหาจุดบริการ">
    </div>
    <ul class="list" id="list"></ul>
  </aside>
  <section>
    <div class="floors" id="floors" role="tablist" aria-label="เลือกชั้น"></div>
    <div class="panel planwrap">
      <div class="plan" id="plan"><p class="msg">กำลังโหลดแผนผัง…</p></div>
    </div>
  </section>
</main>

<dialog id="detail" aria-labelledby="dTitle">
  <div class="dlg-hd"><div><h2 id="dTitle"></h2><small id="dFloor"></small></div>
    <button class="x" id="dClose" aria-label="ปิด">×</button></div>
  <div class="gallery" id="gallery" hidden>
    <img id="gImg" alt="">
    <button class="nav prev" id="gPrev" aria-label="ภาพก่อนหน้า">‹</button>
    <button class="nav next" id="gNext" aria-label="ภาพถัดไป">›</button>
    <span class="count" id="gCount"></span>
  </div>
  <div class="dlg-body" id="dBody"></div>
</dialog>
<dialog id="travel" class="wide" aria-labelledby="tTitle">
  <div class="dlg-hd"><div><h2 id="tTitle">แผนที่การเดินทาง</h2><small>เส้นทางมาสำนักงานที่ดินจังหวัดลำปาง สาขาห้างฉัตร</small></div>
    <button class="x" id="tClose" aria-label="ปิด">×</button></div>
  <video id="tVideo" src="assets/travel-map.mp4" controls muted loop playsinline preload="metadata"></video>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="js/common.js?v=3"></script>
<script src="js/map.js?v=4"></script>
</body>
</html>
